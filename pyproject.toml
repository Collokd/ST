[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsstock"
version = "0.1.0"
description = "Predicting next-day stock direction from financial news sentiment (CIS 635 project)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7", "seaborn>=0.12", "requests>=2.31"]

[project.optional-dependencies]
finbert = ["transformers>=4.40", "torch>=2.1"]
dev = ["pytest>=7.4"]

[project.scripts]
newsstock = "newsstock.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: end-to-end run (deselect with -m \"not slow\")"]
